services:
  # --- 1. APP SERVICE ---
  app:
    image: tinhsoma/backend:v1 # ← Updated với domain mới
    container_name: backend
    restart: always
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ants_ktc?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # Nếu App cần gọi API Python, cấu hình thêm URL này:
      # PYTHON_SERVICE_URL: http://python-gemini:5000

  # --- 2. MYSQL SERVICE ---
  db:
    image: mysql:latest
    container_name: mysqldb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ants_ktc
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql # Đã sửa lỗi căn lề (indentation)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # --- 3. REDIS SERVICE ---
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
