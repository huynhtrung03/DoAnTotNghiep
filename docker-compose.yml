services:
  # --- 1. APP SERVICE ---
  app:
    image: tinhsoma/backend-app:latest # ← Updated via CI/CD
    container_name: backend-app
    restart: always
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # Thêm dòng này nếu App cần gọi sang Python
      python-gemini:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ants_ktc?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # Firebase credentials path (mounted from server)
      firebase.credentials.path: /app/firebase-service-account.json
      # These values will be loaded from .env file on server
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      HERE_API_KEY: ${HERE_API_KEY}
      GOONG_API_KEY: ${GOONG_API_KEY}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro

  # --- 2. MYSQL SERVICE ---
  db:
    image: mysql:latest
    container_name: mysqldb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ants_ktc
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql # Đã sửa lỗi căn lề (indentation)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # --- 3. REDIS SERVICE ---
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  # --- 4. PYTHON GEMINI SERVICE ---
  python-gemini:
    image: tinhsoma/python-gemini:latest # ← Updated via CI/CD
    container_name: python-gemini
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ⚠️ THAY YOUR_GEMINI_API_KEY bằng key thật
      - API_KEY=AIzaSyDkGX0IOmHfReZZkcbyDHN6156H5pSLIDk
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root_password
      - DB_NAME=ants_ktc

  # --- 6. ADMIN DASHBOARD SERVICE ---
  app-ktc:
    image: tinhsoma/app-ktc:latest
    container_name: app-ktc
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  db_data:
