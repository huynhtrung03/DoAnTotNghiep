name: CI/CD Pipeline

on:
  push:
    branches: ["tinh"]
    paths:
      - "spring-ants-ktc/**"
      - "api_gemini/**"
      - "next-app-client/**"
      - "app-ktc/**"
      - "docker-compose.yml"
      - "docker-compose-client.yml"
      - ".github/workflows/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      python: ${{ steps.filter.outputs.python }}
      next: ${{ steps.filter.outputs.next }}
      ktc: ${{ steps.filter.outputs.ktc }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'spring-ants-ktc/**'
            python:
              - 'api_gemini/**'
            next:
              - 'next-app-client/**'
            ktc:
              - 'app-ktc/**'

  # --- BUILD JOBS ---
  build-backend-app:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./spring-ants-ktc
          push: true
          tags: tinhsoma/backend-app:latest

  build-python-gemini:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api_gemini
          push: true
          tags: tinhsoma/python-gemini:latest

  build-next-client:
    needs: changes
    if: ${{ needs.changes.outputs.next == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./next-app-client
          push: true
          tags: tinhsoma/next-app-client:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.HOST_IP }}:3333
            NEXT_PUBLIC_PYTHON_API_URL=http://${{ secrets.HOST_IP }}:5000

  build-app-ktc:
    needs: changes
    if: ${{ needs.changes.outputs.ktc == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app-ktc
          push: true
          tags: tinhsoma/app-ktc:latest

  # --- DEPLOY BACKEND SERVICES ---
  deploy-backend:
    needs: [changes, build-backend-app, build-python-gemini, build-app-ktc]
    # Run deploy-backend if any BACKEND related changes occurred or always if you prefer
    if: ${{ always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ktc == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to backend server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/root/doantotnghiep"

      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/doantotnghiep
            docker compose pull
            docker compose up -d --remove-orphans

  # --- DEPLOY FRONTEND CLIENT ---
  deploy-frontend:
    needs: [changes, build-next-client]
    if: ${{ always() && needs.changes.outputs.next == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to client server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLIENT_HOST_IP }}
          username: ${{ secrets.CLIENT_HOST_USER }}
          key: ${{ secrets.CLIENT_SSH_PRIVATE_KEY }}
          source: "docker-compose-client.yml"
          target: "/root/doantotnghiep"

      - name: Deploy Frontend via SSH
        env:
          NEXTAUTH_URL: http://${{ secrets.CLIENT_HOST_IP }}:3000
        uses: appleboy/ssh-action@v1.0.3
        with:
          envs: NEXTAUTH_URL
          host: ${{ secrets.CLIENT_HOST_IP }}
          username: ${{ secrets.CLIENT_HOST_USER }}
          key: ${{ secrets.CLIENT_SSH_PRIVATE_KEY }}
          script: |
            cd /root/doantotnghiep
            mv docker-compose-client.yml docker-compose.yml
            export NEXTAUTH_URL=$NEXTAUTH_URL
            docker compose pull
            docker compose up -d
