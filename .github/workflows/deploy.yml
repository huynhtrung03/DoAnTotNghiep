name: CI/CD Pipeline

on:
  push:
    branches: ["tinh"]
    paths:
      - "spring-ants-ktc/**"
      - "api_gemini/**"

      - "app-ktc/**"
      - "docker-compose.yml"

      - ".github/workflows/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      python: ${{ steps.filter.outputs.python }}

      ktc: ${{ steps.filter.outputs.ktc }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'spring-ants-ktc/**'
              - 'docker-compose.yml'
            python:
              - 'api_gemini/**'

            ktc:
              - 'app-ktc/**'

  # --- BUILD JOBS ---
  build-backend-app:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./spring-ants-ktc
          push: true
          tags: tinhsoma/backend-app:latest

  build-python-gemini:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api_gemini
          push: true
          tags: tinhsoma/python-gemini:latest

  build-next-client:
    needs: changes
    if: ${{ needs.changes.outputs.next == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tạo file .env từ secret (1 secret chứa toàn bộ ENV)
      - name: Create .env file from secret
        run: |
          echo "${{ secrets.NEXT_CLIENT_ENV }}" > ./next-app-client/.env.production

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./next-app-client
          push: true
          tags: tinhsoma/next-app-client:latest

  build-app-ktc:
    needs: changes
    if: ${{ needs.changes.outputs.ktc == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app-ktc
          push: true
          tags: tinhsoma/app-ktc:latest
          build-args: |
            VITE_API_URL=http://${{ secrets.HOST_IP }}:3333/api

  # --- DEPLOY BACKEND SERVICES ---
  deploy-backend:
    needs: [changes, build-backend-app, build-python-gemini, build-app-ktc]
    # Run deploy-backend if any BACKEND related changes occurred or always if you prefer
    if: ${{ always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ktc == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to backend server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/root/doantotnghiep"

      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/doantotnghiep

            # Stop và remove containers cũ
            docker-compose down --remove-orphans || true

            # Pull images mới từ Docker Hub
            docker-compose pull

            # Khởi động containers mới
            docker-compose up -d

            # Dọn dẹp images cũ
            docker image prune -f

  # --- DEPLOY FRONTEND CLIENT ---
  deploy-frontend:
    needs: [changes, build-next-client]
    if: ${{ always() && needs.changes.outputs.next == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tạo file .env từ secret để copy lên server (cho runtime variables)
      - name: Create .env file for production
        run: |
          echo "${{ secrets.NEXT_CLIENT_ENV }}" > .env

      - name: Copy docker-compose and .env to client server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLIENT_HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-client.yml,.env"
          target: "/root/doantotnghiep"

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLIENT_HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/doantotnghiep
            mv docker-compose-client.yml docker-compose.yml

            # Stop và remove container cũ (tránh lỗi image không tồn tại)
            docker-compose down --remove-orphans || true

            # Pull image mới từ Docker Hub
            docker-compose pull

            # Khởi động container mới
            docker-compose up -d

            # Dọn dẹp image cũ không còn sử dụng
            docker image prune -f
