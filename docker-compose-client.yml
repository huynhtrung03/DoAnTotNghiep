services:
  next-app-client:
    image: tinhsoma/next-app-client:latest
    container_name: next-app-client
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Node.js memory limit (4GB for 8GB RAM system)
      - NODE_OPTIONS=--max-old-space-size=4096
    # Memory limits to prevent server crash (optimized for 8GB RAM)
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G
